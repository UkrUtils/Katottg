# Публікація сайту (VitePress) на GitHub Pages.
#
# Запускається при зміні сайту або документації в main, вручну і з release.yml (workflow_call).
# workflow_call потрібен, бо реліз, створений через GITHUB_TOKEN, не запускає інші workflow:
# без явного виклику сайт (зокрема сторінка історії релізів) не оновився б після релізу.
# У pull request сайт лише збирається й тестується, без розгортання.

name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'README.md', 'Docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'README.md', 'Docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages читає налаштування Pages
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
